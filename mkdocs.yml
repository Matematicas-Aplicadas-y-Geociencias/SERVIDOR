site_name: SERVIDOR
theme:
  name: cinder
  custom_dir: overrides
  color_mode: dark
  header_layout:
    - nav
nav:
  - Inicio: index.md
  - Herramientas de cómputo:
      - Entornos virtuales de Python: herramientas_computo/entornos.md
      - Git y Github: herramientas_computo/git_github.md
  - Modelos:
      - WRF: modelos/wrf.md
      - GeoClaw: modelos/geoclaw.md
      - Delft3D: modelos/delft3d.md
  - APIs: 
      - Copernicus: apis/copernicus.md
      - ERA5: apis/era5.md
      - Hycom: apis/hycom.md

extra_css:
  - css/extra.css
extra_javascript:
   - js/copy-button.js

plugins:
  - search
  - git-revision-date-localized:
      type: date
      locale: es
      fallback_to_build_date: true
